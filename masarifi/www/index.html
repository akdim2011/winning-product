<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a6a50">
<title>مصاريفي</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: phone-first single column. Emerald hero card on top (balance + spending ring), category rows with colored avatars, grouped recent expenses. Bottom bar: Month, Stats, raised add button, Savings, More. PIN lock is a full-screen keypad. */
:root{
  --bg:#f3f5f9; --card:#ffffff; --ink:#101828; --muted:#667085; --line:#e8ecf3; --soft:#eef2f7;
  --brand:#0f8f6b; --brand-ink:#ffffff; --danger:#d9402f; --warn:#c77700; --hero-a:#0a6a50; --hero-b:#14a67e;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 10px 28px rgba(16,24,40,.07);
  --font-display:'Cairo',system-ui,sans-serif; --font-body:'Tajawal',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1210; --card:#121c18; --ink:#eaf3ef; --muted:#8fa39a; --line:#1f2e28; --soft:#18251f;
    --brand:#2ed39e; --brand-ink:#06281d; --danger:#ff7a68; --warn:#f0b04a; --hero-a:#0b5a44; --hero-b:#119170;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1210; --card:#121c18; --ink:#eaf3ef; --muted:#8fa39a; --line:#1f2e28; --soft:#18251f;
  --brand:#2ed39e; --brand-ink:#06281d; --danger:#ff7a68; --warn:#f0b04a; --hero-a:#0b5a44; --hero-b:#119170;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;margin:0;
  padding-block:0 112px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
#app{max-width:560px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
button,input,textarea{font:inherit;color:inherit}
svg{display:block}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.cur{font-size:.7em;font-weight:600;opacity:.8;margin-inline-start:3px}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* hero */
.hero{margin-top:12px;border-radius:24px;padding:18px;color:#fff;background:linear-gradient(140deg,var(--hero-a),var(--hero-b));box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.07);inset-inline-start:-70px;top:-90px;pointer-events:none}
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px;position:relative;z-index:1}
.monthbar h1{font-size:1.15rem;font-weight:700}
.nb{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;cursor:pointer;display:grid;place-items:center}
.nb:active{background:rgba(255,255,255,.28)}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px}
.mnav h1{font-size:1.15rem;font-weight:700}
.mnav .nb{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.hero-main{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;position:relative;z-index:1}
.hero-main small{display:block;opacity:.85;font-size:.85rem}
.left-n{font-family:var(--font-display);font-size:2.1rem;font-weight:800;line-height:1.15}
.left-n.neg{color:#ffd0c8}
.ring{width:96px;height:96px;flex-shrink:0;position:relative}
.ring svg{width:96px;height:96px;transform:rotate(-90deg)}
.ring .t{stroke:rgba(255,255,255,.2)}
.ring .v{stroke:#fff;transition:stroke-dashoffset .5s}
.ring .v.over{stroke:#ffb4a8}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:1.05rem}
.hint-d{margin-top:10px;font-size:.85rem;opacity:.92;position:relative;z-index:1;background:rgba(255,255,255,.14);border-radius:10px;padding:6px 10px;display:inline-block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;position:relative;z-index:1}
.stats div{background:rgba(255,255,255,.13);border-radius:14px;padding:10px 8px;text-align:center;min-width:0}
.stats small{display:block;opacity:.85;font-size:.78rem}
.stats b{font-family:var(--font-display);font-size:.98rem;font-weight:700;overflow-wrap:anywhere}
.stats input{width:100%;background:transparent;border:0;border-bottom:1px dashed rgba(255,255,255,.5);color:#fff;text-align:center;font-family:var(--font-display);font-weight:700;font-size:.98rem;padding:0 0 1px;border-radius:0}
.stats input::placeholder{color:rgba(255,255,255,.6)}
.stats input:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* sections */
.card{background:var(--card);border-radius:20px;padding:16px;margin-top:14px;box-shadow:var(--shadow)}
.sec{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:22px 4px 0}
.sec h2{font-size:1.02rem;font-weight:700}
.sec+.card{margin-top:10px}
.mix{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--soft);gap:2px}
.mix i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:.85rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.cat{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.cat:last-child{border-bottom:0;padding-bottom:2px}
.cat:first-child{padding-top:2px}
.av{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:1.05rem;color:#fff;flex-shrink:0;border:0;cursor:default}
.av.sm{width:32px;height:32px;border-radius:10px;font-size:.8rem}
.cat .mid{flex:1;min-width:0}
.cat .nm{font-weight:700;overflow-wrap:anywhere;line-height:1.3}
.pill{display:inline-block;font-size:.7rem;font-weight:700;background:var(--soft);color:var(--muted);border-radius:99px;padding:1px 8px;margin-inline-start:6px;vertical-align:middle}
.cat .sub{font-size:.82rem;color:var(--muted)}
.cat .sub.over{color:var(--danger);font-weight:700}
.bar{height:6px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:99px}
.addb{width:40px;height:40px;border-radius:12px;border:0;background:var(--soft);color:var(--brand);cursor:pointer;display:grid;place-items:center;flex-shrink:0}
.addb:active{transform:scale(.94)}
.day{font-size:.8rem;color:var(--muted);font-weight:700;margin:14px 0 4px}
.day:first-child{margin-top:0}
.exp{display:flex;align-items:center;gap:12px;padding:8px 0;cursor:pointer}
.exp .av{width:38px;height:38px;border-radius:12px;font-size:.9rem}
.exp .t{flex:1;min-width:0}
.exp .t b{display:block;font-weight:700;line-height:1.25}
.exp .t small{color:var(--muted);overflow-wrap:anywhere}
.exp .amt{font-family:var(--font-display);font-weight:700}
.trash{width:36px;height:36px;border-radius:10px;border:0;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;flex-shrink:0}
.trash.arm{background:var(--danger);color:#fff;width:auto;padding:0 10px;font-size:.8rem;font-weight:700}
.empty{color:var(--muted);text-align:center;padding:18px 8px}
.empty svg{margin:0 auto 6px;opacity:.5;width:34px;height:34px}
.banner{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--warn);border-radius:16px;padding:10px 12px;margin-top:12px;font-size:.88rem}
.banner span{flex:1}
.banner button{border:0;background:var(--warn);color:#fff;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer}
.banner .x{background:transparent;color:var(--muted);padding:6px}

/* nav */
.nav{position:fixed;inset-inline:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 70px 1fr 1fr;align-items:end;padding-inline:4px}
.nav button.tab{border:0;background:transparent;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 2px 8px;font-size:.72rem;font-weight:700;min-height:58px;white-space:nowrap}
.nav button.tab[aria-current="true"]{color:var(--brand)}
.fab{width:60px;height:60px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);cursor:pointer;display:grid;place-items:center;margin:0 auto 14px;box-shadow:0 8px 20px rgba(15,143,107,.4);justify-self:center}
.fab:active{transform:scale(.94)}
.fab svg{width:28px;height:28px}

/* stats */
.proj{text-align:center}
.proj small{color:var(--muted)}
.proj .big{font-family:var(--font-display);font-weight:800;font-size:2rem;line-height:1.2}
.gauge{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin:12px 0 6px;position:relative}
.gauge i{display:block;height:100%;border-radius:99px}
.st-ok{color:var(--brand)} .st-warn{color:var(--warn)} .st-bad{color:var(--danger)}
.msg{margin:8px 0 0;font-weight:700}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;position:relative;margin-top:8px;padding-top:18px}
.bars .col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;position:relative;z-index:1}
.bars .col b{font-size:.68rem;font-family:var(--font-display);color:var(--muted)}
.bars .col i{display:block;width:100%;max-width:34px;border-radius:8px 8px 3px 3px;background:var(--soft);min-height:3px}
.bars .col.on i{background:var(--brand)}
.bars .col.on b{color:var(--ink)}
.bars .ref{position:absolute;left:0;right:0;border-top:1.5px dashed var(--warn);z-index:0;opacity:.8}
.mlab{display:flex;gap:8px;margin-top:6px}
.mlab span{flex:1;text-align:center;font-size:.68rem;color:var(--muted);min-width:0}
.alert{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.alert:last-child{border-bottom:0}
.alert .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.alert span{flex:1;min-width:0}
.delta{font-family:var(--font-display);font-weight:700;white-space:nowrap}

/* savings */
.sv{text-align:center}
.sv .ring{width:150px;height:150px;margin:6px auto 0}
.sv .ring svg{width:150px;height:150px}
.sv .ring .t{stroke:var(--soft)}
.sv .ring .v{stroke:var(--brand)}
.sv .ring span{font-size:1.6rem;color:var(--ink)}
.sv h2{font-size:1.2rem;margin-top:8px}
.sv .big{font-family:var(--font-display);font-weight:800;font-size:1.6rem;margin-top:4px}
.sv .big small{color:var(--muted);font-weight:600;font-size:.9rem}
.tip{background:var(--soft);border-radius:14px;padding:12px;margin-top:12px;text-align:start}
.row2{display:flex;gap:8px;margin-top:14px}
.btn{border:0;border-radius:14px;padding:13px 18px;background:var(--brand);color:var(--brand-ink);font-weight:700;cursor:pointer;min-height:48px;font-family:var(--font-display)}
.btn.full{width:100%}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn:active{transform:scale(.98)}

/* more / editor */
.mrow{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:transparent;border-inline:0;border-top:0;width:100%;text-align:start}
.mrow:last-child{border-bottom:0}
.mrow .ico{width:40px;height:40px;border-radius:12px;background:var(--soft);color:var(--brand);display:grid;place-items:center;flex-shrink:0}
.mrow b{display:block;font-family:var(--font-display)}
.mrow small{color:var(--muted)}
.mrow .tx{flex:1;min-width:0}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--brand);font-weight:700;cursor:pointer;padding:10px 4px 0;font-family:var(--font-display)}
.cblock{padding:10px 0;border-bottom:1px solid var(--line)}
.cblock:last-of-type{border-bottom:0}
.crow{display:grid;grid-template-columns:44px 1fr 96px auto;gap:8px;align-items:center}
.crow input,.field{width:100%;min-width:0;padding:11px 10px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.crow input.b{text-align:end}
.crow .av{cursor:pointer}
.frow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;padding-inline-start:52px;font-size:.85rem;color:var(--muted)}
.sw{width:46px;height:26px;border-radius:99px;border:0;background:var(--line);position:relative;cursor:pointer;flex-shrink:0;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-end:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:inset .15s}
.sw[aria-pressed="true"]{background:var(--brand)}
.sw[aria-pressed="true"]::after{inset-inline-end:23px}
.note{color:var(--muted);font-size:.88rem;margin:0 0 6px}
.status{color:var(--muted);font-size:.82rem;text-align:center;margin-top:18px}
textarea.field{min-height:120px;resize:vertical;font-size:.8rem;direction:ltr;text-align:left;margin-top:8px}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(5,10,8,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:10px 18px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet.noanim{animation:none}
.grab{width:42px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 14px}
.sheet h3{font-size:1.1rem;text-align:center}
.sheet label{display:block;color:var(--muted);font-size:.85rem;margin:14px 0 4px}
.sheet input{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.sheet .amount{border:0;background:transparent;text-align:center;font-family:var(--font-display);font-size:2.4rem;font-weight:800;padding:6px 0;color:var(--ink)}
.sheet .amount:focus-visible{outline:none}
.sheet .unit{text-align:center;color:var(--muted);margin-top:-6px;font-size:.85rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 14px 6px 8px;cursor:pointer;font-weight:700;font-size:.9rem}
.chip .av{width:26px;height:26px;border-radius:50%;font-size:.7rem}
.chip.on{border-color:var(--brand);background:var(--soft)}
.actions{display:flex;gap:8px;margin-top:18px}
.actions .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;font-size:.9rem;z-index:60;box-shadow:var(--shadow);pointer-events:none;animation:tt 1.8s ease forwards;white-space:nowrap}
@keyframes tt{0%{opacity:0;transform:translate(-50%,10px)}12%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0}}

/* pin */
.pin{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:20px;overflow:auto}
.pin h2{font-size:1.25rem;text-align:center}
.pin p{margin:0;color:var(--muted);text-align:center;min-height:1.4em}
.dots{display:flex;gap:16px}
.dots i{width:15px;height:15px;border-radius:50%;border:2px solid var(--brand)}
.dots i.on{background:var(--brand)}
.dots.err{animation:shk .35s}
.dots.err i{border-color:var(--danger);background:var(--danger)}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px}
.key{width:76px;height:76px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow);font-family:var(--font-display);font-size:1.6rem;font-weight:700;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.key:active{background:var(--soft)}
.key.blank{background:transparent;box-shadow:none;cursor:default}
.linkb{border:0;background:transparent;color:var(--muted);text-decoration:underline;cursor:pointer;padding:6px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{border:0;background:transparent;border-radius:10px;padding:9px;font-weight:700;cursor:pointer;font-family:var(--font-display)}
.seg button.on{background:var(--card);box-shadow:var(--shadow)}
.srow{display:grid;grid-template-columns:92px 1fr auto;gap:8px;align-items:center;padding:8px 0 2px}
select.field{appearance:auto}
.ai-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ai-h b{font-family:var(--font-display)}
.btn.sm{padding:8px 14px;min-height:38px;font-size:.88rem;border-radius:12px}
#tips-out{white-space:pre-wrap;line-height:1.7;margin-top:10px}
@media (prefers-reduced-motion:reduce){.sheet,.toast,.dots.err{animation:none}.ring .v{transition:none}}
</style>

</head>
<body>
<div id="app" dir="rtl"></div>

<script>
(function(){
var MONTHS=['يناير','فبراير','مارس','أبريل','ماي','يونيو','يوليوز','غشت','شتنبر','أكتوبر','نونبر','دجنبر'];
var LS='masarifi-v1',PINK='masarifi-pin';
var PAL=['#3b82f6','#f59e0b','#ef4444','#8b5cf6','#10b981','#ec4899','#14b8a6','#f97316','#6366f1','#84cc16'];
var uid=function(){return Math.random().toString(36).slice(2,9)};
var pad=function(n){return String(n).padStart(2,'0')};
var nowKey=function(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)};
var todayStr=function(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var num=function(v){var n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};
var fmt=function(n){return (Math.round(n*100)/100).toLocaleString('en-US')};
var money=function(n){return '<span class="num">'+fmt(n)+'</span><span class="cur">د.م</span>'};
var monthLabel=function(m){return MONTHS[+m.slice(5)-1]+' '+m.slice(0,4)};
var shift=function(m,d){var y=+m.slice(0,4),mo=+m.slice(5)-1+d;y+=Math.floor(mo/12);mo=((mo%12)+12)%12;return y+'-'+pad(mo+1)};
var mIndex=function(m){return +m.slice(0,4)*12+ +m.slice(5)-1};
function I(p){return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">'+p+'</svg>'}
var ICO={
  prev:'<path d="M9 6l6 6-6 6"/>',next:'<path d="M15 6l-6 6 6 6"/>',back:'<path d="M9 6l6 6-6 6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  month:'<path d="M4 20V11M10 20V4M16 20v-6M22 20H2"/>',
  stats:'<path d="M3 17l6-6 4 4 8-9"/><path d="M15 6h6v6"/>',
  goal:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".6"/>',
  more:'<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>',
  cats:'<rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/>',

function defaults(){
  return {rev:0,lastBackup:0,income:{},exp:[],goal:null,cats:[
    {id:'c1',name:'kiraa',base:1400,b:{}},{id:'c2',name:'lwalida',base:500,b:{}},
    {id:'c3',name:'daw',base:400,b:{}},{id:'c4',name:'intirnit',base:300,b:{}},
    {id:'c5',name:'sok',base:1000,b:{}},{id:'c6',name:'kobz',base:180,b:{}},
    {id:'c7',name:'COSINA',base:500,b:{}},{id:'c8',name:'taha',base:100,b:{}},
    {id:'c9',name:'botat',base:110,b:{}}
  ]};
}
function normalize(d){
  var x=defaults();
  if(!d||typeof d!=='object')return x;
  x.rev=num(d.rev);x.lastBackup=num(d.lastBackup);
  x.income=d.income&&typeof d.income==='object'?d.income:{};
  x.exp=Array.isArray(d.exp)?d.exp:[];
  x.goal=d.goal&&typeof d.goal==='object'?d.goal:null;
  if(Array.isArray(d.cats))x.cats=d.cats.map(function(c){
    var o={id:c.id||uid(),name:String(c.name||''),base:num(c.base),b:(c.b&&typeof c.b==='object')?c.b:{}};
    if(c.col)o.col=c.col;if(c.fixed){o.fixed=true;o.since=c.since||'0000-00'}
    return o;
  });
  if(x.goal&&!Array.isArray(x.goal.deposits))x.goal.deposits=[];
  return x;
}
function loadLocal(){try{var r=localStorage.getItem(LS);if(r)return normalize(JSON.parse(r))}catch(e){}return defaults()}

var AI={s:null,d:null,tips:null,busyTips:false};

function save(){
  S.rev=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  dirty=true;clearTimeout(timer);timer=setTimeout(flush,500);

function flush(){
  if(!dbDoc||saving||!dirty)return;
  saving=true;dirty=false;
  dbDoc.set(JSON.parse(JSON.stringify(S))).then(function(){sync='cloud'}).catch(function(){sync='error'}).then(function(){
    saving=false;
    if(dirty)flush();else{var s=document.getElementById('status');if(s)s.textContent=statusText()}
  });
}
function statusText(){
  return sync==='cloud'?'كلشي محفوظ فحسابك':sync==='error'?'ما قدرناش نحفظو فالحساب، بقى محفوظ فهاد التيليفون':'محفوظ فهاد التيليفون';
}

/* ---------- calculations ---------- */
function colOf(c){
  if(c.col)return c.col;
  var h=0,s=String(c.id);for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;
  return PAL[h%PAL.length];
}
function avatar(c,extra,cls){
  var n=(c&&c.name||'?').trim();
  return '<span class="av'+(cls?' '+cls:'')+'"'+(extra||'')+' style="background:'+(c?colOf(c):'#98a2b3')+'">'+esc(n.charAt(0).toUpperCase())+'</span>';
}
function budgetFor(c,m){
  var keys=Object.keys(c.b||{}).filter(function(k){return k<=m}).sort();
  return keys.length?num(c.b[keys[keys.length-1]]):num(c.base);
}
function fixedPart(c,m){return c.fixed&&m>=(c.since||'0000-00')?budgetFor(c,m):0}
function manualPart(c,m){return S.exp.reduce(function(t,e){return e.m===m&&e.c===c.id?t+num(e.a):t},0)}
function spentCat(c,m){return fixedPart(c,m)+manualPart(c,m)}
function manualAll(m){return S.exp.reduce(function(t,e){return e.m===m?t+num(e.a):t},0)}
function fixedAll(m){return S.cats.reduce(function(t,c){return t+fixedPart(c,m)},0)}
function spentAll(m){return manualAll(m)+fixedAll(m)}
function budgetAll(m){return S.cats.reduce(function(t,c){return t+budgetFor(c,m)},0)}
function goalSaved(g){return num(g.start)+g.deposits.reduce(function(t,d){return t+num(d.a)},0)}
function catById(id){return S.cats.filter(function(x){return x.id===id})[0]}
function dim(){var d=new Date();return new Date(d.getFullYear(),d.getMonth()+1,0).getDate()}
function catEst(c,m){
  if(m!==nowKey())return spentCat(c,m);
  var day=new Date().getDate();
  return fixedPart(c,m)+manualPart(c,m)/day*dim();
}
function projection(m){
  if(m!==nowKey())return spentAll(m);
  var day=new Date().getDate();
  return fixedAll(m)+manualAll(m)/day*dim();
}
function dayLabel(d){
  if(d===todayStr())return 'اليوم';
  var y=new Date();y.setDate(y.getDate()-1);
  var ys=y.getFullYear()+'-'+pad(y.getMonth()+1)+'-'+pad(y.getDate());
  if(d===ys)return 'البارح';
  return d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4);
}
function ring(pct,over){
  var C=2*Math.PI*52,off=C*(1-Math.max(0,Math.min(1,pct)));
  return '<svg viewBox="0 0 120 120" aria-hidden="true"><circle class="t" cx="60" cy="60" r="52" fill="none" stroke-width="11"/><circle class="v'+(over?' over':'')+'" cx="60" cy="60" r="52" fill="none" stroke-width="11" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/></svg>';
}
function needBackup(){
  if(S.exp.length<5)return false;
  return !S.lastBackup||Date.now()-S.lastBackup>14*86400000;
}

  h+='<div class="hero"><div class="monthbar"><button class="nb" data-a="prev" aria-label="الشهر اللي قبل">'+I(ICO.prev)+'</button><h1>'+esc(monthLabel(cur))+'</h1><button class="nb" data-a="next" aria-label="الشهر اللي بعد">'+I(ICO.next)+'</button></div>'
    +'<div class="hero-main"><div><small>'+(inc>0?'الباقي من الدخل':'الباقي من الميزانية')+'</small><div class="left-n'+(left<0?' neg':'')+'">'+money(left)+'</div></div>'

  }

    +'<div><small>الميزانية</small><b>'+money(tb)+'</b></div><div><small>صرفتي</small><b>'+money(ts)+'</b></div></div></div>';

    h+='</div><div class="legend">';
    parts.slice(0,5).forEach(function(p){h+='<span><i style="background:'+colOf(p.c)+'"></i>'+esc(p.c.name)+' <b class="num">'+Math.round(p.v/ts*100)+'%</b></span>'});
    h+='</div></div>';
  }

  h+='<div class="sec"><h2>التصنيفات</h2></div><div class="card">';
  if(!S.cats.length)h+='<div class="empty">ما كاين حتى تصنيف. زيد واحد من المزيد.</div>';
  S.cats.forEach(function(c){
    var b=budgetFor(c,cur),s=spentCat(c,cur),p=b>0?Math.min(100,s/b*100):(s>0?100:0),over=s>b;
    var fx=fixedPart(c,cur)>0;
    h+='<div class="cat">'+avatar(c)+'<div class="mid"><div class="nm">'+esc(c.name)+(fx?'<span class="pill">ثابت</span>':'')+'</div>'
      +'<div class="sub'+(over?' over':'')+'"><span class="num">'+fmt(s)+'</span> / <span class="num">'+fmt(b)+'</span> د.م'+(over?' · فاتت بـ <span class="num">'+fmt(s-b)+'</span>':'')+'</div>'
      +'<div class="bar"><i style="width:'+p+'%;background:'+(over?'var(--danger)':colOf(c))+'"></i></div></div>'
      +'<button class="addb" data-a="addexp" data-id="'+c.id+'" aria-label="زيد مصروف فـ '+esc(c.name)+'">'+I(ICO.plus)+'</button></div>';
  });
  h+='</div>';

  var list=S.exp.filter(function(e){return e.m===cur}).sort(function(a,b){return a.d<b.d?1:(a.d>b.d?-1:0)});
  h+='<div class="sec"><h2>آخر المصاريف</h2></div><div class="card">';
  var fa=fixedAll(cur);
  if(fa>0)h+='<p class="note">المصاريف الثابتة ('+money(fa)+') كتتحسب بوحدها كل شهر.</p>';
  if(!list.length)h+='<div class="empty">'+I(ICO.empty)+'ما سجلتي حتى مصروف هاد الشهر.<br>ضغط على + باش تبدا.</div>';
  var lastD='';

      +'<div class="amt">−'+money(num(e.a))+'</div>'
      +'<button class="trash'+(armed===key?' arm':'')+'" data-a="delexp" data-id="'+e.id+'" aria-label="مسح">'+(armed===key?'تأكيد؟':I(ICO.trash))+'</button></div>';
  });

  return h;

function mnav(){
  return '<div class="mnav"><button class="nb" data-a="prev" aria-label="الشهر اللي قبل">'+I(ICO.prev)+'</button><h1>'+esc(monthLabel(cur))+'</h1><button class="nb" data-a="next" aria-label="الشهر اللي بعد">'+I(ICO.next)+'</button></div>';
}
function statsView(){
  var inc=num(S.income[cur]),tb=budgetAll(cur),ts=spentAll(cur),ref=inc>0?inc:tb,isNow=cur===nowKey();
  var proj=Math.round(projection(cur)),h=mnav();

  /* projection */
  h+='<div class="card proj">';
  if(ref<=0){
    h+='<small>التوقع</small><p class="msg">زيد الدخل ولا الميزانية باش نحسب ليك التوقع.</p>';
  }else{
    var ratio=proj/ref,cls=ratio<=.9?'st-ok':ratio<=1?'st-warn':'st-bad';
    h+='<small>'+(isNow?'التوقع ديال نهاية الشهر':'مجموع الشهر')+'</small><div class="big '+cls+'">'+money(proj)+'</div>'
      +'<div class="gauge"><i style="width:'+Math.min(100,ratio*100)+'%;background:var(--'+(ratio<=.9?'brand':ratio<=1?'warn':'danger')+')"></i></div>'
      +'<small>من '+(inc>0?'الدخل':'الميزانية')+' <span class="num">'+fmt(ref)+'</span> د.م</small>';
    var msg;
    if(ratio<=.9)msg='مزيان، غتسالي الشهر وباقي ليك حوالي '+money(Math.round(ref-proj))+'.';
    else if(ratio<=1)msg='قريب من الحد. دير الحساب مزيان فالأيام الباقية.';
    else{
      msg='غتفوت الحد بـ '+money(proj-ref)+'.';
      var rd=dim()-new Date().getDate();
      if(isNow&&rd>0)msg+=' نقص حوالي <b class="num">'+fmt((proj-ref)/rd)+'</b> د.م فكل نهار.';
    }
    h+='<p class="msg '+cls+'">'+msg+'</p>';
    var prev=spentAll(shift(cur,-1));
    if(prev>0){
      var dp=Math.round((proj-prev)/prev*100);
      h+='<p class="note" style="margin-top:8px">'+(isNow?'التوقع':'المجموع')+' '+(dp>=0?'أكثر':'أقل')+' من الشهر اللي فات بـ <b class="num">'+Math.abs(dp)+'%</b>.</p>';
    }
  }
  h+='</div>';

  if(AI.s){
    var tp=AI.tips&&AI.tips.m===cur?AI.tips:null;
    h+='<div class="card"><div class="ai-h"><b>'+I(ICO.spark)+'نصائح ذكية</b><button class="btn sm" data-a="tips"'+(AI.busyTips?' disabled':'')+'>'+(AI.busyTips?'كنفكر...':(tp&&tp.text?'عاود':'عطيني نصائح'))+'</button></div>';
    if(tp&&(tp.text||AI.busyTips))h+='<div id="tips-out">'+esc(tp.text||'كنفكر...')+'</div>';

    h+='</div>';
  }

  /* last 6 months */
  var ms=[];for(var k=5;k>=0;k--)ms.push(shift(cur,-k));
  var vals=ms.map(spentAll),mx=Math.max.apply(null,vals.concat([ref,1]));

  ms.forEach(function(m,i){
    h+='<div class="col'+(m===cur?' on':'')+'"><b class="num">'+(vals[i]>0?(vals[i]>=1000?(Math.round(vals[i]/100)/10)+'k':Math.round(vals[i])):'')+'</b><i style="height:'+(vals[i]/mx*(100-12))+'%"></i></div>';
  });
  h+='</div><div class="mlab">';
  ms.forEach(function(m){h+='<span>'+esc(MONTHS[+m.slice(5)-1])+'</span>'});
  h+='</div>'+(ref>0?'<p class="note" style="margin-top:10px">الخط المتقطع هو '+(inc>0?'الدخل':'الميزانية')+'.</p>':'')+'</div>';

  /* alerts */
  var al=[];
  S.cats.forEach(function(c){
    var b=budgetFor(c,cur),s=spentCat(c,cur);if(b<=0)return;
    if(c.fixed&&manualPart(c,cur)===0)return;

    else if(r>=.8)al.push({r:r,t:esc(c.name)+' وصلات '+Math.round(r*100)+'% من الميزانية',col:'var(--warn)'});
  });
  al.sort(function(a,b){return b.r-a.r});
  if(inc>0&&ts>0){var sr=Math.round((inc-ts)/inc*100);al.push({r:0,t:sr>=0?'ادخرتي '+sr+'% من الدخل هاد الشهر':'صرفتي أكثر من الدخل بـ '+Math.abs(sr)+'%',col:sr>=10?'var(--brand)':sr>=0?'var(--warn)':'var(--danger)'})}
  h+='<div class="sec"><h2>تنبيهات</h2></div><div class="card">';
  if(!al.length)h+='<div class="empty">ما كاين حتى تنبيه. كلشي ماشي مزيان.</div>';

  h+='</div>';

  /* category comparison */

      +'<span class="delta" style="flex:none;color:var(--'+(x.d>0?'danger':'brand')+')">'+(x.d>0?'+':'−')+'<span class="num">'+fmt(Math.abs(x.d))+'</span></span></div>';
  });

  h+='</div>';
  return h;
}

  h+='<p class="note" style="margin-top:10px">حيدتي هاد الشهر: <b class="num">'+fmt(thisMonth)+'</b> د.م</p>'
    +'<div class="row2"><button class="btn" style="flex:1" data-a="adddep">+ زيد فلوس للادخار</button><button class="btn ghost" data-a="editgoal">تعديل</button></div></div>';

  h+='<div class="sec"><h2>التحويلات</h2></div><div class="card">';

function errCopy(e){

  if(c==='session_expired')return 'خاصك تدخل لحسابك من جديد.';

function cleanItems(arr){
  if(!Array.isArray(arr))return [];
  var ids=catIds(),out=[],t=todayStr();
  arr.slice(0,20).forEach(function(x){
    if(!x||typeof x!=='object')return;
    var a=num(x.amount);if(!(a>0)||a>1e7)return;
    var c=ids.indexOf(x.cat)>=0?x.cat:'';
    var d=/^\d{4}-\d{2}-\d{2}$/.test(String(x.date||''))?String(x.date):t;
    var diff=(new Date(t)-new Date(d))/86400000;if(!(diff>=-1&&diff<=400))d=t;
    out.push({a:Math.round(a*100)/100,c:c,n:String(x.note||'').slice(0,60),d:d});
  });
  return out;
}

function sha(str){
  try{
    if(window.crypto&&crypto.subtle&&window.TextEncoder){
      return crypto.subtle.digest('SHA-256',new TextEncoder().encode(str)).then(function(b){
        return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2)}).join('');
      });
    }
  }catch(e){}
  var h=5381;for(var i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))|0;
  return Promise.resolve('f'+h);
}
function setPin(p){var salt=uid()+uid();return sha(salt+p).then(function(h){localStorage.setItem(PINK,JSON.stringify({s:salt,h:h}))})}
function checkPin(p){
  var o;try{o=JSON.parse(localStorage.getItem(PINK))}catch(e){}
  if(!o)return Promise.resolve(true);
  return sha(o.s+p).then(function(h){return h===o.h});
}
function pinOpen(mode){pin={mode:mode,buf:'',first:'',err:false};render()}
function pinFail(){pin.err=true;render();setTimeout(function(){pin.err=false;pin.buf='';render()},450)}
function pinDone(){
  var m=pin.mode,b=pin.buf;
  if(m==='unlock'||m==='verify-off'||m==='verify-change'){
    checkPin(b).then(function(ok){
      if(!ok){pinFail();return}
      if(m==='unlock'){locked=false;pin={mode:null,buf:'',first:'',err:false};render()}
      else if(m==='verify-off'){try{localStorage.removeItem(PINK)}catch(e){}pin={mode:null,buf:'',first:'',err:false};render();toast('تلغى القفل')}
      else pinOpen('new');
    });
  }else if(m==='new'){pin.first=b;pin.buf='';pin.mode='confirm';render()}
  else if(m==='confirm'){
    if(b===pin.first){setPin(b).then(function(){pin={mode:null,buf:'',first:'',err:false};render();toast('تفعل القفل')})}
    else{pin.err=true;render();setTimeout(function(){pin={mode:'new',buf:'',first:'',err:false};render()},450)}
  }
}

/* ---------- backup ---------- */
function backupText(){return JSON.stringify({app:'masarifi',v:2,t:Date.now(),data:S})}
function markBackup(){S.lastBackup=Date.now();save()}
function shareBackup(){
  var txt=backupText(),P=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Share;
  var p=null;
  if(P&&P.share)p=P.share({title:'نسخة مصاريفي',text:txt,dialogTitle:'حفظ النسخة الاحتياطية'});
  else if(navigator.share)p=navigator.share({title:'نسخة مصاريفي',text:txt});
  if(p){p.then(function(){markBackup();render();toast('تحفظات النسخة')}).catch(function(){});return}
  copyBackup();
}
function copyBackup(){
  bk.text=backupText();
  function manual(){bk.show=true;render();var t=document.getElementById('bk-out');if(t){t.focus();t.select()}toast('نسخ النص بيدك')}
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(bk.text).then(function(){markBackup();render();toast('تنسخات النسخة')}).catch(manual);return;
    }
  }catch(e){}
  manual();
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-a]');if(!t)return;
  var a=t.getAttribute('data-a'),id=t.getAttribute('data-id');
  if(t.classList.contains('overlay')&&e.target!==t)return;
  if(a.slice(0,3)!=='del'&&a!=='restore'&&a!=='pinforgot')armed=null;
  if(a==='mic'){
    if(!AI.d)return;
    if(AI.d.active()){AI.d.stop().catch(function(){})}
    else AI.d.start().catch(function(er){var c=er&&er.code;if(c!=='stopped'&&c!=='dismissed')toast(c==='not_granted'?'سمح بالميكروفون باش تتكلم':'التسجيل الصوتي ما خداماش دابا')});
    return;
  }
  if(a==='key'){if(pin.buf.length<4&&!pin.err){pin.buf+=id;render();if(pin.buf.length===4)setTimeout(pinDone,100)}return}
  if(a==='pinback'){pin.buf=pin.buf.slice(0,-1);render();return}
  if(a==='pincancel'){pin={mode:null,buf:'',first:'',err:false};render();return}
  if(a==='pinforgot'){
    if(arm('forgot')){try{localStorage.removeItem(LS);localStorage.removeItem(PINK)}catch(x){}S=defaults();locked=false;pin={mode:null,buf:'',first:'',err:false};armed=null;render();toast('تمسح كلشي')}
    return;
  }
  if(a==='tab'){tab=id;sub=null;closeSheet();render();window.scrollTo(0,0)}
  else if(a==='sub'){sub=id||null;render();window.scrollTo(0,0)}
  else if(a==='gobackup'){tab='more';sub='backup';render();window.scrollTo(0,0)}
  else if(a==='dismiss'){dismissed=true;render()}
  else if(a==='prev'){cur=shift(cur,-1);render()}
  else if(a==='next'){cur=shift(cur,1);render()}
  else if(a==='close'){closeSheet();render()}
  else if(a==='mode'){
    if(id==='smart'){closeSheet();sheet={t:'smart',text:'',items:null,err:'',busy:false};render()}
    else{closeSheet();selCat=selCat&&catById(selCat)?selCat:S.cats[0].id;sheet={t:'exp'};render()}
  }
  else if(a==='analyze'){analyze()}
  else if(a==='smdel'){if(sheet&&sheet.items){sheet.items.splice(+id,1);if(!sheet.items.length)sheet.items=null;render()}}
  else if(a==='smsave'){
    if(!sheet||!sheet.items||!sheet.items.length)return;
    if(sheet.items.some(function(x){return !x.c||!(x.a>0)})){toast('اختار التصنيف ديال كل مصروف');return}
    var lastM=cur;
    sheet.items.forEach(function(x){S.exp.push({id:uid(),m:x.d.slice(0,7),c:x.c,a:x.a,n:x.n,d:x.d});lastM=x.d.slice(0,7)});
    var cnt=sheet.items.length;cur=lastM;sheet=null;save();render();toast('تسجلو '+cnt+' مصاريف');
  }
  else if(a==='tips'){askTips()}
  else if(a==='addexp'){if(!S.cats.length){tab='more';sub='cats';render();return}selCat=id||(selCat&&catById(selCat)?selCat:S.cats[0].id);sheet={t:'exp'};render()}
  else if(a==='editexp'){var ex=S.exp.filter(function(x){return x.id===id})[0];if(ex){selCat=ex.c;sheet={t:'exp',id:id};render()}}
  else if(a==='pick'){
    sheet.amt=document.getElementById('f-amt').value;sheet.note=document.getElementById('f-note').value;sheet.date=document.getElementById('f-date').value;
    selCat=id;render();
  }
  else if(a==='saveexp'){
    var amt=num(document.getElementById('f-amt').value);if(amt<=0)return;
    var dt=document.getElementById('f-date').value||(nowKey()===cur?todayStr():cur+'-01');
    var note=document.getElementById('f-note').value.trim();
    if(sheet.id){var ex2=S.exp.filter(function(x){return x.id===sheet.id})[0];if(ex2){ex2.a=amt;ex2.c=selCat;ex2.n=note;ex2.d=dt;ex2.m=dt.slice(0,7)}}
    else S.exp.push({id:uid(),m:dt.slice(0,7),c:selCat,a:amt,n:note,d:dt});
    cur=dt.slice(0,7);
    var was=sheet.id;sheet=null;save();render();toast(was?'تحفظ التعديل':'تسجل المصروف');
  }
  else if(a==='delexp'){if(arm('delexp'+id)){S.exp=S.exp.filter(function(x){return x.id!==id});save();render()}}
  else if(a==='adddep'){sheet={t:'dep'};render()}
  else if(a==='savedep'){
    var v=num(document.getElementById('f-amt').value);if(v<=0)return;
    S.goal.deposits.push({id:uid(),a:v,d:todayStr()});
    sheet=null;save();render();toast('تزادو الفلوس للادخار');
  }
  else if(a==='deldep'){if(arm('deldep'+id)){S.goal.deposits=S.goal.deposits.filter(function(x){return x.id!==id});save();render()}}
  else if(a==='editgoal'){sheet={t:'goal'};render()}
  else if(a==='savegoal'){
    var tg=num(document.getElementById('f-target').value);if(tg<=0)return;
    var old=S.goal;
    S.goal={name:document.getElementById('f-name').value.trim(),target:tg,start:num(document.getElementById('f-start').value),deadline:document.getElementById('f-dead').value||'',deposits:old?old.deposits:[]};
    sheet=null;save();render();
  }
  else if(a==='delgoal'){if(arm('delgoal')){S.goal=null;sheet=null;save();render()}}
  else if(a==='addcat'){
    var used=S.cats.map(colOf),free=PAL.filter(function(c){return used.indexOf(c)<0});
    S.cats.push({id:uid(),name:'تصنيف جديد',base:0,b:{},col:(free[0]||PAL[S.cats.length%PAL.length])});save();render();
  }
  else if(a==='color'){var c=catById(id);if(c){var i=PAL.indexOf(colOf(c));c.col=PAL[(i+1)%PAL.length];save();render()}}
  else if(a==='fixed'){var c3=catById(id);if(c3){if(c3.fixed){delete c3.fixed;delete c3.since}else{c3.fixed=true;c3.since=cur}save();render()}}
  else if(a==='delcat'){if(arm('delcat'+id)){S.cats=S.cats.filter(function(x){return x.id!==id});save();render()}}
  else if(a==='share'){shareBackup()}
  else if(a==='copy'){copyBackup()}
  else if(a==='restore'){
    var inp=document.getElementById('bk-in');bk.paste=inp?inp.value:'';
    if(!bk.paste.trim()){toast('الصق النسخة أولا');return}
    if(arm('restore')){
      try{
        var o=JSON.parse(bk.paste.trim()),d=o&&o.data?o.data:o;
        if(!d||!Array.isArray(d.cats))throw 0;
        S=normalize(d);S.lastBackup=Date.now();bk.paste='';bk.show=false;save();render();toast('تسترجعات البيانات');
      }catch(x){armed=null;render();toast('النص ماصحيحش')}
    }
  }
  else if(a==='pinon'){pinOpen('new')}
  else if(a==='pinchange'){pinOpen('verify-change')}
  else if(a==='pinoff'){pinOpen('verify-off')}
});

document.addEventListener('change',function(e){
  var t=e.target,f=t.getAttribute&&t.getAttribute('data-f');if(!f)return;
  var id=t.getAttribute('data-id');
  if(f==='income'){S.income[cur]=num(t.value);save();render()}
  else if(f==='catname'){var c=catById(id);if(c){c.name=t.value.trim()||c.name;save();render()}}
  else if(f==='catbud'){var c2=catById(id);if(c2){c2.b[cur]=num(t.value);save();render()}}
});
document.addEventListener('input',function(e){if(e.target&&e.target.id==='sm-text'&&sheet)sheet.text=e.target.value});
document.addEventListener('change',function(e){
  var t=e.target,f=t.getAttribute&&t.getAttribute('data-f');
  if((f==='sm-a'||f==='sm-c')&&sheet&&sheet.items){
    var it=sheet.items[+t.getAttribute('data-i')];if(!it)return;
    if(f==='sm-a')it.a=num(t.value);else it.c=t.value;
    if(f==='sm-c')render();
  }
});
document.addEventListener('visibilitychange',function(){
  if(document.hidden){lastHide=Date.now();return}
  if(hasPin()&&!locked&&lastHide&&Date.now()-lastHide>30000){locked=true;pin={mode:'unlock',buf:'',first:'',err:false};sheet=null;render()}
});

if(hasPin()){locked=true;pin.mode='unlock'}
render();

function startCloud(){
  if(!window.claude||!claude.use)return;
  Promise.all([claude.use('db'),claude.use('user')]).then(function(r){
    var db=r[0],user=r[1];if(!db||!user)return;
    return user.id().then(function(id){
      if(!id)return;
      dbDoc=db.doc('data/users/'+id+'/budget');
      dbDoc.onSnapshot(function(snap){
        if(snap.metadata.hasPendingWrites)return;
        var d=snap.exists?snap.data():null;
        if(d&&num(d.rev)>S.rev){
          S=normalize(JSON.parse(JSON.stringify(d)));
          try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
          sync='cloud';if(!locked&&!sheet)render();
        }else if(S.rev>0&&(!d||num(d.rev)<S.rev)){dirty=true;flush()}
        else{sync='cloud';var s=document.getElementById('status');if(s)s.textContent=statusText()}
      },function(){sync='error';var s=document.getElementById('status');if(s)s.textContent=statusText()});
    });
  }).catch(function(){});
}
startCloud();

function afterAI(){if(!locked&&!sheet&&!pin.mode)render()}
function initAI(){
  if(!window.claude||!claude.use)return;
  claude.use('sample').then(function(s){if(s&&s.json){AI.s=s;afterAI()}}).catch(function(){});
  claude.use('dictation').then(function(d){
    if(!d)return;AI.d=d;
    d.onFinal(function(e){var ta=document.getElementById('sm-text');if(ta&&sheet&&sheet.t==='smart'){ta.value=(ta.value+e.text).replace(/^\s+/,'');sheet.text=ta.value}});
    d.onPartial(function(e){var el=document.getElementById('sm-part');if(el)el.textContent=e.text});
    d.onState(function(e){var b=document.getElementById('sm-mic');if(b)b.textContent=e.state==='idle'?'تكلم':(e.state==='starting'?'كنحضر...':'وقف التسجيل');if(e.state==='idle'){var el=document.getElementById('sm-part');if(el)el.textContent=''}});
    afterAI();
  }).catch(function(){});
}
initAI();
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){navigator.serviceWorker.register("sw.js").catch(function(){})}
})();
