<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f7a5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>مصاريفي</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: phone-first, one column, month header on top, three tabs pinned at the bottom (month / savings / categories) */
:root{
  --bg:#f2f5f3; --surface:#ffffff; --fg:#14231e; --muted:#5c6e67; --line:#dbe4df;
  --accent:#0f7a5c; --accent-fg:#ffffff; --warn:#c2410c; --track:#e4ece8;
  --font-display:'Cairo',system-ui,sans-serif; --font-body:'Tajawal',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1612; --surface:#15221c; --fg:#e8f1ed; --muted:#93a69d; --line:#26362f;
    --accent:#3ecf9f; --accent-fg:#06281d; --warn:#fb923c; --track:#22332b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1612; --surface:#15221c; --fg:#e8f1ed; --muted:#93a69d; --line:#26362f;
  --accent:#3ecf9f; --accent-fg:#06281d; --warn:#fb923c; --track:#22332b; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font-body); font-size:16px; line-height:1.5;
  padding-block:0 96px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
#app{max-width:560px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:16px 8px}
.top h1{font-size:1.35rem;font-weight:800}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.2rem;line-height:1}
.iconbtn:focus-visible,.btn:focus-visible,.nav button:focus-visible,input:focus-visible,select:focus-visible,.row-add:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-block:12px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.sum small{display:block;color:var(--muted);font-size:.8rem}
.sum b{font-family:var(--font-display);font-size:1.15rem;font-weight:700}
.sum .left b{color:var(--accent)}
.sum .left.neg b{color:var(--warn)}
.bar{height:8px;background:var(--track);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over i{background:var(--warn)}
.income{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.income label{color:var(--muted);font-size:.9rem}
.field{width:130px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);text-align:end}
.sec-title{display:flex;justify-content:space-between;align-items:center;margin-top:20px}
.sec-title h2{font-size:1.05rem}
.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--accent);color:var(--accent-fg);font-weight:700;cursor:pointer;min-height:44px}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--warn);border:1px solid var(--warn)}
.btn.small{padding:8px 12px;min-height:36px;font-size:.9rem}
.cat{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.cat:last-child{border-bottom:0}
.cat .name{font-weight:700;min-width:0;overflow-wrap:anywhere}
.cat .meta{color:var(--muted);font-size:.85rem}
.cat .bar{grid-column:1 / -1;margin-top:4px}
.row-add{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:1.3rem;cursor:pointer;grid-row:1 / 3;grid-column:2}
.exp{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.exp:last-child{border-bottom:0}
.exp .t{min-width:0;overflow-wrap:anywhere}
.exp .t small{display:block;color:var(--muted)}
.exp .r{display:flex;align-items:center;gap:8px;flex-shrink:0}
.empty{color:var(--muted);text-align:center;padding:16px 0}
.nav{position:fixed;inset-inline:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.nav div{display:flex;width:100%;max-width:560px}
.nav button{flex:1;border:0;background:transparent;padding:12px 4px;cursor:pointer;color:var(--muted);font-weight:700;min-height:56px}
.nav button[aria-current="true"]{color:var(--accent)}
.goalhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.goalhead h2{font-size:1.2rem}
.big{font-family:var(--font-display);font-size:1.8rem;font-weight:800}
.pill{display:inline-block;background:var(--track);border-radius:99px;padding:2px 10px;font-size:.85rem;color:var(--muted)}
.tip{background:var(--track);border-radius:12px;padding:12px;margin-top:12px}
.crow{display:grid;grid-template-columns:1fr 110px auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow input{width:100%;min-width:0;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.crow input.b{text-align:end}
.hint{color:var(--muted);font-size:.85rem}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:20px 16px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.sheet h3{margin-bottom:12px}
.sheet label{display:block;color:var(--muted);font-size:.9rem;margin-top:12px}
.sheet input,.sheet select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-top:4px}
.sheet .actions{display:flex;gap:8px;margin-top:18px}
.sheet .actions .btn{flex:1}
.status{color:var(--muted);font-size:.85rem;text-align:center;margin-top:16px}
</style>

</head>
<body>
<div id="app" dir="rtl"></div>

<script>
(function(){
var MONTHS=['يناير','فبراير','مارس','أبريل','ماي','يونيو','يوليوز','غشت','شتنبر','أكتوبر','نونبر','دجنبر'];
var LS='masarifi-v1';
var uid=function(){return Math.random().toString(36).slice(2,9)};
var pad=function(n){return String(n).padStart(2,'0')};
var nowKey=function(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var num=function(v){var n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};
var fmt=function(n){return (Math.round(n*100)/100).toLocaleString('en-US')};
var monthLabel=function(m){return MONTHS[+m.slice(5)-1]+' '+m.slice(0,4)};
var shift=function(m,d){var y=+m.slice(0,4),mo=+m.slice(5)-1+d;y+=Math.floor(mo/12);mo=((mo%12)+12)%12;return y+'-'+pad(mo+1)};
var mIndex=function(m){return +m.slice(0,4)*12+ +m.slice(5)-1};

function defaults(){
  return {rev:0,income:{},exp:[],goal:null,cats:[
    {id:'c1',name:'kiraa',base:1400,b:{}},
    {id:'c2',name:'lwalida',base:500,b:{}},
    {id:'c3',name:'daw',base:400,b:{}},
    {id:'c4',name:'intirnit',base:300,b:{}},
    {id:'c5',name:'sok',base:1000,b:{}},
    {id:'c6',name:'kobz',base:180,b:{}},
    {id:'c7',name:'COSINA',base:500,b:{}},
    {id:'c8',name:'taha',base:100,b:{}},
    {id:'c9',name:'botat',base:110,b:{}}
  ]};
}
function normalize(d){
  var x=defaults();
  if(!d||typeof d!=='object')return x;
  x.rev=num(d.rev);
  x.income=d.income&&typeof d.income==='object'?d.income:{};
  x.exp=Array.isArray(d.exp)?d.exp:[];
  x.goal=d.goal&&typeof d.goal==='object'?d.goal:null;
  if(Array.isArray(d.cats))x.cats=d.cats.map(function(c){return {id:c.id||uid(),name:String(c.name||''),base:num(c.base),b:(c.b&&typeof c.b==='object')?c.b:{}}});
  if(x.goal&&!Array.isArray(x.goal.deposits))x.goal.deposits=[];
  return x;
}
function loadLocal(){try{var r=localStorage.getItem(LS);if(r)return normalize(JSON.parse(r))}catch(e){}return defaults()}

var S=loadLocal();
var cur=nowKey();
var tab='month';
var sheet=null;
var armed=null;
var sync='local';
var dbDoc=null,saving=false,dirty=false,timer=null;

function save(){
  S.rev=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  dirty=true;clearTimeout(timer);timer=setTimeout(flush,500);
}
function flush(){
  if(!dbDoc||saving||!dirty)return;
  saving=true;dirty=false;
  dbDoc.set(JSON.parse(JSON.stringify(S))).then(function(){sync='cloud'}).catch(function(){sync='error'}).then(function(){
    saving=false;
    if(dirty)flush();else{var s=document.getElementById('status');if(s)s.textContent=statusText()}
  });
}
function statusText(){
  return sync==='cloud'?'كلشي محفوظ فحسابك':sync==='error'?'ما قدرناش نحفظو فالحساب، بقى محفوظ فهاد التيليفون':'محفوظ فهاد التيليفون';
}

function budgetFor(c,m){
  var keys=Object.keys(c.b||{}).filter(function(k){return k<=m}).sort();
  return keys.length?num(c.b[keys[keys.length-1]]):num(c.base);
}
function spentCat(c,m){return S.exp.reduce(function(t,e){return e.m===m&&e.c===c.id?t+num(e.a):t},0)}
function spentAll(m){return S.exp.reduce(function(t,e){return e.m===m?t+num(e.a):t},0)}
function goalSaved(g){return num(g.start)+g.deposits.reduce(function(t,d){return t+num(d.a)},0)}
function catName(id){var c=S.cats.filter(function(x){return x.id===id})[0];return c?c.name:'تصنيف محذوف'}

function monthView(){
  var inc=num(S.income[cur]);
  var tb=S.cats.reduce(function(t,c){return t+budgetFor(c,cur)},0);
  var ts=spentAll(cur);
  var left=inc>0?inc-ts:tb-ts;
  var leftLabel=inc>0?'الباقي من الدخل':'الباقي من الميزانية';
  var pct=tb>0?Math.min(100,ts/tb*100):0;
  var h='<div class="top"><button class="iconbtn" data-a="next" aria-label="الشهر اللي بعد">›</button><h1>'+esc(monthLabel(cur))+'</h1><button class="iconbtn" data-a="prev" aria-label="الشهر اللي قبل">‹</button></div>';
  h+='<div class="card"><div class="sum">'
    +'<div><small>الميزانية</small><b class="num">'+fmt(tb)+'</b></div>'
    +'<div><small>صرفتي</small><b class="num">'+fmt(ts)+'</b></div>'
    +'<div class="left'+(left<0?' neg':'')+'"><small>'+leftLabel+'</small><b class="num">'+fmt(left)+'</b></div></div>'
    +'<div class="bar'+(ts>tb&&tb>0?' over':'')+'"><i style="width:'+pct+'%"></i></div>'
    +'<div class="income"><label for="inc">الدخل ديال هاد الشهر (DH)</label><input id="inc" class="field num" data-f="income" inputmode="decimal" value="'+(inc||'')+'" placeholder="0"></div></div>';
  h+='<div class="sec-title"><h2>التصنيفات</h2><button class="btn small" data-a="addexp">+ مصروف</button></div><div class="card" style="margin-top:8px">';
  if(!S.cats.length)h+='<div class="empty">ما كاين حتى تصنيف. زيد واحد من تبويب التصنيفات.</div>';
  S.cats.forEach(function(c){
    var b=budgetFor(c,cur),s=spentCat(c,cur),p=b>0?Math.min(100,s/b*100):(s>0?100:0),over=s>b;
    h+='<div class="cat"><div class="name">'+esc(c.name)+'</div><button class="row-add" data-a="addexp" data-id="'+c.id+'" aria-label="زيد مصروف فـ '+esc(c.name)+'">+</button>'
      +'<div class="meta num">'+fmt(s)+' / '+fmt(b)+' DH'+(over?' · فاتت بـ '+fmt(s-b):'')+'</div>'
      +'<div class="bar'+(over?' over':'')+'"><i style="width:'+p+'%"></i></div></div>';
  });
  h+='</div>';
  var list=S.exp.filter(function(e){return e.m===cur}).sort(function(a,b){return a.d<b.d?1:-1});
  h+='<div class="sec-title"><h2>آخر المصاريف</h2></div><div class="card" style="margin-top:8px">';
  if(!list.length)h+='<div class="empty">ما سجلتي حتى مصروف هاد الشهر.</div>';
  list.forEach(function(e){
    var key='delexp'+e.id;
    h+='<div class="exp"><div class="t"><b>'+esc(catName(e.c))+'</b>'+(e.n?'<small>'+esc(e.n)+'</small>':'')+'<small class="num">'+esc(String(e.d).slice(8,10)+'/'+String(e.d).slice(5,7))+'</small></div>'
      +'<div class="r"><b class="num">'+fmt(num(e.a))+'</b><button class="btn small ghost" data-a="delexp" data-id="'+e.id+'">'+(armed===key?'تأكيد؟':'مسح')+'</button></div></div>';
  });
  h+='</div>';
  return h;
}

function goalView(){
  var g=S.goal;
  var h='<div class="top"><h1>الادخار</h1></div>';
  if(!g){
    return h+'<div class="card"><p>ما عندك حتى هدف دابا. حدد شنو بغيتي تجمع وفاش، وغنحسبو ليك شحال خاصك تحيد كل شهر.</p><button class="btn" data-a="editgoal">+ زيد هدف</button></div>';
  }
  var saved=goalSaved(g),target=num(g.target),rem=Math.max(0,target-saved),pct=target>0?Math.min(100,saved/target*100):0;
  var monthsLeft=g.deadline?Math.max(1,mIndex(g.deadline)-mIndex(nowKey())+1):0;
  var thisMonth=g.deposits.filter(function(d){return String(d.d).slice(0,7)===cur}).reduce(function(t,d){return t+num(d.a)},0);
  h+='<div class="card"><div class="goalhead"><h2>'+esc(g.name||'الهدف')+'</h2><span class="pill">'+Math.round(pct)+'%</span></div>'
    +'<div class="big num" style="margin-top:8px">'+fmt(saved)+' <small class="hint">/ '+fmt(target)+' DH</small></div>'
    +'<div class="bar"><i style="width:'+pct+'%"></i></div>'
    +'<p class="hint" style="margin:10px 0 0">باقي ليك <b class="num">'+fmt(rem)+'</b> DH'+(g.deadline?' قبل '+esc(monthLabel(g.deadline)):'')+'</p>';
  if(rem===0)h+='<div class="tip">بلغتي الهدف، مبروك!</div>';
  else if(monthsLeft>0)h+='<div class="tip">خاصك تحيد تقريبا <b class="num">'+fmt(Math.ceil(rem/monthsLeft))+'</b> DH فالشهر ('+monthsLeft+' شهر باقيين).</div>';
  h+='<p class="hint" style="margin:10px 0 0">حيدتي هاد الشهر: <b class="num">'+fmt(thisMonth)+'</b> DH</p>'
    +'<div style="display:flex;gap:8px;margin-top:14px"><button class="btn" style="flex:1" data-a="adddep">+ زيد فلوس للادخار</button><button class="btn ghost" data-a="editgoal">تعديل</button></div></div>';
  var inc=num(S.income[cur]);
  if(inc>0){
    var free=inc-spentAll(cur);
    h+='<div class="card"><b>باقي ليك هاد الشهر</b><p class="hint" style="margin:4px 0 0">بعد المصاريف المسجلة، باقي <b class="num">'+fmt(free)+'</b> DH. تقدر تحيد منهم للهدف.</p></div>';
  }
  h+='<div class="sec-title"><h2>التحويلات</h2></div><div class="card" style="margin-top:8px">';
  if(!g.deposits.length)h+='<div class="empty">ما زدتي حتى فلوس للادخار بعد.</div>';
  g.deposits.slice().sort(function(a,b){return a.d<b.d?1:-1}).forEach(function(d){
    var key='deldep'+d.id;
    h+='<div class="exp"><div class="t num">'+esc(String(d.d).slice(8,10)+'/'+String(d.d).slice(5,7)+'/'+String(d.d).slice(0,4))+'</div><div class="r"><b class="num">+'+fmt(num(d.a))+'</b><button class="btn small ghost" data-a="deldep" data-id="'+d.id+'">'+(armed===key?'تأكيد؟':'مسح')+'</button></div></div>';
  });
  h+='</div>';
  return h;
}

function catsView(){
  var h='<div class="top"><h1>التصنيفات</h1></div><div class="card"><p class="hint" style="margin-top:0">بدل الاسم أو المبلغ ديال '+esc(monthLabel(cur))+'. المبلغ الجديد كيبقى فالشهور اللي جاية حتى تبدلو.</p>';
  if(!S.cats.length)h+='<div class="empty">زيد أول تصنيف.</div>';
  S.cats.forEach(function(c){
    var key='delcat'+c.id;
    h+='<div class="crow"><input data-f="catname" data-id="'+c.id+'" value="'+esc(c.name)+'" aria-label="اسم التصنيف"><input class="b num" data-f="catbud" data-id="'+c.id+'" inputmode="decimal" value="'+budgetFor(c,cur)+'" aria-label="الميزانية"><button class="btn small ghost" data-a="delcat" data-id="'+c.id+'">'+(armed===key?'تأكيد؟':'مسح')+'</button></div>';
  });
  h+='<button class="btn" style="margin-top:14px;width:100%" data-a="addcat">+ زيد تصنيف جديد</button></div>';
  h+='<div class="status" id="status">'+statusText()+'</div>';
  return h;
}

function sheetView(){
  if(!sheet)return '';
  var h='<div class="overlay" data-a="close"><div class="sheet" role="dialog" aria-modal="true">';
  if(sheet.t==='exp'){
    h+='<h3>مصروف جديد</h3><label for="f-cat">التصنيف</label><select id="f-cat">';
    S.cats.forEach(function(c){h+='<option value="'+c.id+'"'+(c.id===sheet.id?' selected':'')+'>'+esc(c.name)+'</option>'});
    h+='</select><label for="f-amt">المبلغ (DH)</label><input id="f-amt" class="num" inputmode="decimal" placeholder="0"><label for="f-note">ملاحظة (اختياري)</label><input id="f-note" placeholder="مثلا: سوق الأحد">'
      +'<div class="actions"><button class="btn ghost" data-a="close">إلغاء</button><button class="btn" data-a="saveexp">سجل</button></div>';
  }else if(sheet.t==='dep'){
    h+='<h3>زيد فلوس للادخار</h3><label for="f-amt">المبلغ (DH)</label><input id="f-amt" class="num" inputmode="decimal" placeholder="0">'
      +'<div class="actions"><button class="btn ghost" data-a="close">إلغاء</button><button class="btn" data-a="savedep">زيد</button></div>';
  }else if(sheet.t==='goal'){
    var g=S.goal||{name:'',target:'',start:'',deadline:''};
    h+='<h3>'+(S.goal?'تعديل الهدف':'هدف جديد')+'</h3><label for="f-name">شنو بغيتي تجمع؟</label><input id="f-name" value="'+esc(g.name)+'" placeholder="مثلا: السفر، الطوموبيل، صندوق الطوارئ">'
      +'<label for="f-target">المبلغ المطلوب (DH)</label><input id="f-target" class="num" inputmode="decimal" value="'+esc(g.target)+'">'
      +'<label for="f-start">شحال عندك دابا (DH)</label><input id="f-start" class="num" inputmode="decimal" value="'+esc(g.start)+'" placeholder="0">'
      +'<label for="f-dead">فاش بغيتي توصل (اختياري)</label><input id="f-dead" type="month" value="'+esc(g.deadline)+'">'
      +'<div class="actions"><button class="btn ghost" data-a="close">إلغاء</button><button class="btn" data-a="savegoal">حفظ</button></div>'
      +(S.goal?'<button class="btn danger" style="width:100%;margin-top:10px" data-a="delgoal">'+(armed==='delgoal'?'تأكيد المسح؟':'مسح الهدف')+'</button>':'');
  }
  return h+'</div></div>';
}

function render(){
  var body=tab==='month'?monthView():tab==='goal'?goalView():catsView();
  var nav='<nav class="nav"><div>'
    +'<button data-a="tab" data-id="month" aria-current="'+(tab==='month')+'">الشهر</button>'
    +'<button data-a="tab" data-id="goal" aria-current="'+(tab==='goal')+'">الادخار</button>'
    +'<button data-a="tab" data-id="cats" aria-current="'+(tab==='cats')+'">التصنيفات</button></div></nav>';
  document.getElementById('app').innerHTML=body+nav+sheetView();
  if(sheet){var f=document.getElementById('f-amt')||document.getElementById('f-name');if(f)setTimeout(function(){f.focus()},50)}
}

function arm(key){if(armed===key){armed=null;return true}armed=key;render();return false}

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-a]');if(!t)return;
  var a=t.getAttribute('data-a'),id=t.getAttribute('data-id');
  if(t.classList.contains('overlay')&&e.target!==t)return;
  if(a.slice(0,3)!=='del')armed=null;
  if(a==='tab'){tab=id;sheet=null;render()}
  else if(a==='prev'){cur=shift(cur,-1);render()}
  else if(a==='next'){cur=shift(cur,1);render()}
  else if(a==='close'){sheet=null;render()}
  else if(a==='addexp'){if(!S.cats.length){tab='cats';render();return}sheet={t:'exp',id:id||S.cats[0].id};render()}
  else if(a==='saveexp'){
    var amt=num(document.getElementById('f-amt').value);if(amt<=0)return;
    var d=new Date(),day=nowKey()===cur?d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()):cur+'-01';
    S.exp.push({id:uid(),m:cur,c:document.getElementById('f-cat').value,a:amt,n:document.getElementById('f-note').value.trim(),d:day});
    sheet=null;save();render();
  }
  else if(a==='delexp'){if(arm('delexp'+id)){S.exp=S.exp.filter(function(x){return x.id!==id});save();render()}}
  else if(a==='adddep'){sheet={t:'dep'};render()}
  else if(a==='savedep'){
    var v=num(document.getElementById('f-amt').value);if(v<=0)return;
    var n=new Date();S.goal.deposits.push({id:uid(),a:v,d:n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate())});
    sheet=null;save();render();
  }
  else if(a==='deldep'){if(arm('deldep'+id)){S.goal.deposits=S.goal.deposits.filter(function(x){return x.id!==id});save();render()}}
  else if(a==='editgoal'){sheet={t:'goal'};render()}
  else if(a==='savegoal'){
    var tg=num(document.getElementById('f-target').value);if(tg<=0)return;
    var old=S.goal;
    S.goal={name:document.getElementById('f-name').value.trim(),target:tg,start:num(document.getElementById('f-start').value),deadline:document.getElementById('f-dead').value||'',deposits:old?old.deposits:[]};
    sheet=null;save();render();
  }
  else if(a==='delgoal'){if(arm('delgoal')){S.goal=null;sheet=null;save();render()}}
  else if(a==='addcat'){S.cats.push({id:uid(),name:'تصنيف جديد',base:0,b:{}});save();render()}
  else if(a==='delcat'){if(arm('delcat'+id)){S.cats=S.cats.filter(function(x){return x.id!==id});save();render()}}
});

document.addEventListener('change',function(e){
  var t=e.target,f=t.getAttribute&&t.getAttribute('data-f');if(!f)return;
  var id=t.getAttribute('data-id');
  if(f==='income'){S.income[cur]=num(t.value);save();render()}
  else if(f==='catname'){var c=S.cats.filter(function(x){return x.id===id})[0];if(c){c.name=t.value.trim()||c.name;save();render()}}
  else if(f==='catbud'){var c2=S.cats.filter(function(x){return x.id===id})[0];if(c2){c2.b[cur]=num(t.value);save();render()}}
});

render();

function startCloud(){
  if(!window.claude||!claude.use)return;
  Promise.all([claude.use('db'),claude.use('user')]).then(function(r){
    var db=r[0],user=r[1];if(!db||!user)return;
    return user.id().then(function(id){
      if(!id)return;
      dbDoc=db.doc('data/users/'+id+'/budget');
      dbDoc.onSnapshot(function(snap){
        if(snap.metadata.hasPendingWrites)return;
        var d=snap.exists?snap.data():null;
        if(d&&num(d.rev)>S.rev){
          S=normalize(JSON.parse(JSON.stringify(d)));
          try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
          sync='cloud';render();
        }else if(S.rev>0&&(!d||num(d.rev)<S.rev)){dirty=true;flush()}
        else{sync='cloud';var s=document.getElementById('status');if(s)s.textContent=statusText()}
      },function(){sync='error';var s=document.getElementById('status');if(s)s.textContent=statusText()});
    });
  }).catch(function(){});
}
startCloud();
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){navigator.serviceWorker.register("sw.js").catch(function(){})}
})();
</script>

</html>
