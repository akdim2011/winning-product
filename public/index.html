<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2447C8">
<title>Radar COD</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#ECEFF6; --surface:#FFFFFF; --ink:#0E1430; --muted:#5A6385; --line:#D3D9EA;
  --accent:#2447C8; --accent-ink:#FFFFFF; --soft:#E1E7FA; --signal:#F2A413;
  --good:#0F8A5F; --warn:#B26A00; --bad:#B3302C;
  --good-bg:#D9F1E7; --warn-bg:#FBEBCB; --bad-bg:#F7DCDB;
  --f-display:"Cairo","Segoe UI",Tahoma,sans-serif; --f-body:"Tajawal","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0A0F22; --surface:#121936; --ink:#E8ECFB; --muted:#98A2CC; --line:#252E55;
  --accent:#7C98FF; --accent-ink:#0A0F22; --soft:#1B2552; --signal:#F5B93B;
  --good:#4CD3A1; --warn:#EDB550; --bad:#F08A86;
  --good-bg:#10312A; --warn-bg:#382C12; --bad-bg:#3A1F24; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;padding:0 16px 48px}
.wrap{max-width:1180px;margin-inline:auto}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.25}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;align-items:center;gap:12px;padding-block:20px 14px}
.mark{width:46px;height:46px;flex:none}
.mark .sweep{transform-origin:50% 50%}
body.loading .mark .sweep{animation:sweep 1.1s linear infinite}
@keyframes sweep{to{transform:rotate(360deg)}}
header h1{font-size:1.55rem;font-weight:800;letter-spacing:-.01em;direction:ltr}
header p{margin:0;color:var(--muted);font-size:.9rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>label,.lbl{font-size:.85rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 14px;font-size:.92rem}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.chip:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.seg button{border:0;background:transparent;padding:8px 18px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.stack{display:grid;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
select,input[type=number]{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0}
input[type=number]{width:100%}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:10px 22px;font-weight:700}
.note{font-size:.82rem;color:var(--muted);margin:8px 0 0}
.banner{border-radius:12px;padding:12px 14px;font-size:.9rem;margin-bottom:14px}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.ok{background:var(--good-bg);color:var(--good)}
.banner details{margin-top:6px;font-size:.82rem;word-break:break-word}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.thumb{position:relative;aspect-ratio:4/5;background:var(--soft);display:grid;place-items:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.ads .thumb img{object-fit:cover}
.jm .thumb{aspect-ratio:1/1;background:#fff}.jm .thumb img{object-fit:contain;padding:8px}
.rank{position:absolute;top:8px;inset-inline-start:8px;background:var(--ink);color:var(--bg);font-family:var(--f-display);font-weight:800;font-size:.82rem;border-radius:8px;padding:1px 9px}
.score{position:absolute;top:8px;inset-inline-end:8px;font-family:var(--f-display);font-weight:800;border-radius:10px;padding:2px 10px;font-size:1.05rem}
.tone-good{background:var(--good-bg);color:var(--good)}
.tone-warn{background:var(--warn-bg);color:var(--warn)}
.tone-bad{background:var(--bad-bg);color:var(--bad)}
.noimg{color:var(--muted);font-size:.85rem}
.body{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}
.body h3{font-size:.95rem;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.body h3 a{color:inherit;text-decoration:none}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.facts div{background:var(--bg);border-radius:10px;padding:6px 2px;font-size:.72rem;color:var(--muted);line-height:1.3}
.facts b{display:block;font-family:var(--f-display);font-size:1.05rem;color:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px;font-size:.76rem}
.tag{border-radius:99px;padding:1px 9px;background:var(--soft);color:var(--accent)}
.tag.hot{background:var(--warn-bg);color:var(--warn)}
.links{display:flex;gap:8px;font-size:.84rem}
.links a{flex:1;text-align:center;text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:6px 4px;color:var(--accent);font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.82rem;color:var(--muted)}
.meta b{color:var(--ink)}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:.78rem;color:var(--muted)}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;background:var(--accent)}
details.calcbox{border-top:1px solid var(--line);padding-top:8px;margin-top:auto}
details.calcbox summary{cursor:pointer;font-size:.84rem;font-weight:700;color:var(--accent)}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.calc .fld>label{font-size:.75rem}.calc input{padding:6px 8px;font-size:.9rem}
.verdict{display:flex;justify-content:space-between;align-items:center;font-size:.82rem;margin-top:8px}
.pill{padding:2px 10px;border-radius:99px;font-weight:700;font-size:.8rem}
.empty{text-align:center;color:var(--muted);padding:50px 12px}
.num{font-variant-numeric:tabular-nums}
@media (max-width:560px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .body{padding:10px;gap:6px}.body h3{font-size:.84rem}
  .facts b{font-size:.95rem}.facts div{font-size:.68rem}
  .calc{grid-template-columns:1fr}
  .links a{font-size:.78rem}
}
@media (prefers-reduced-motion:reduce){body.loading .mark .sweep{animation:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="var(--accent)"/><g fill="none" stroke="#fff" stroke-width="2" opacity=".85"><circle cx="32" cy="32" r="7"/><circle cx="32" cy="32" r="13" opacity=".7"/><circle cx="32" cy="32" r="19" opacity=".45"/></g><g class="sweep"><path d="M32 32 L32 13 A19 19 0 0 1 48.5 22.5 Z" fill="#F2A413" opacity=".9"/></g><circle cx="32" cy="32" r="2.2" fill="#fff"/><circle cx="44" cy="21" r="2.6" fill="#F2A413" stroke="#fff" stroke-width="1"/></svg>
  <div><h1>Radar COD</h1><p>المنتجات اللي كتباع دابا فالإعلانات، حسب البلد.</p></div>
</header>

<div class="panel stack">
  <div class="fld"><span class="lbl">البلد</span><div class="chips" id="countries"></div></div>
  <div class="fld"><span class="lbl">المصدر</span>
    <div class="seg" id="sources"><button data-s="ads" aria-pressed="true">الإعلانات</button><button data-s="jumia" aria-pressed="false">Jumia</button></div></div>
  <div class="fld"><span class="lbl">النيش</span><div class="chips" id="niches"></div></div>
  <div class="row">
    <div class="fld"><label for="limit">عدد المنتجات</label><select id="limit"><option>10</option><option>20</option><option>30</option></select></div>
    <div class="fld"><label for="sort">الترتيب</label><select id="sort"><option value="score">الأعلى سكور</option><option value="new">الأحدث</option><option value="old">الأقدم (بقا خدام)</option></select></div>
    <button class="btn" id="go">اعرض المنتجات</button>
  </div>
</div>

<details class="panel" id="assume">
  <summary style="cursor:pointer;font-weight:700">افتراضات حساب الربح (COD)</summary>
  <div class="row" style="margin-top:12px" id="assumeRow"></div>
  <p class="note">كتستعمل فحساب الربح ديال كل منتج. بدّلها بأرقامك الحقيقية.</p>
</details>

<div id="usage" class="note"></div>
<div id="status"></div>
<div class="grid" id="grid"></div>
</div>

<script>
(function(){
var COUNTRIES={MA:{n:'المغرب',cur:'د.م',fx:10,on:true},SA:{n:'السعودية',cur:'ر.س',fx:3.75},AE:{n:'الإمارات',cur:'د.إ',fx:3.67},DZ:{n:'الجزائر',cur:'د.ج',fx:135},TN:{n:'تونس',cur:'د.ت',fx:3.1},EG:{n:'مصر',cur:'ج.م',fx:48}};
var A={ship:35,other:10,ret:20,cpl:25,conf:60,del:70};
var AF=[['ship','التوصيل'],['other','مصاريف أخرى'],['ret','ثمن الرجوع'],['cpl','تكلفة الإعلان (CPL)'],['conf','التأكيد %'],['del','التسليم %']];
var S={country:'MA',source:'ads',niche:'beauty',items:[],nichesList:[]};
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function fmt(n){return isFinite(n)?Math.round(n).toLocaleString('en-US'):'-'}
function cur(){return COUNTRIES[S.country].cur}
function tone(sc){return sc>=60?'good':sc>=40?'warn':'bad'}

/* الربح لكل طلب بافتراضات COD */
function profit(sell,cost){
  var c=A.conf/100,d=A.del/100,D=c*d;
  if(sell<=0||D<=0)return {pts:0,net:0,margin:0,loss:true};
  var be=D*(sell-cost-A.ship-A.other)-(c-D)*A.ret;
  var pl=be-A.cpl,net=pl/D;
  return {pts:pl>0?clamp(net/sell/0.30,0,1)*50:0,net:net,margin:net/sell,loss:pl<=0};
}
function verdict(p){
  if(p.loss)return {t:'خاسر',c:'bad'};
  if(p.margin>=.25)return {t:'ربح مزيان',c:'good'};
  if(p.margin>=.12)return {t:'ربح متوسط',c:'warn'};
  return {t:'ربح ضعيف',c:'bad'};
}
/* Jumia: سكور = السوق (50) + الربح (50) */
function jmScore(it){
  var rk=clamp(1-(it.rank-1)/Math.max(S.items.length,10),0,1)*20;
  var rv=clamp(Math.log10(Math.max(it.reviews,1))/5,0,1)*20;
  var ra=it.rating?clamp((it.rating-3.5)/1.5,0,1):.5;
  var m=rk+rv+ra*10,p=profit(it.sell,it.cost);
  var sc=Math.round(m+p.pts);if(p.loss)sc=Math.min(sc,39);
  return {sc:sc,m:m,p:p};
}
function totalScore(it){return it.ads!=null?it.score:jmScore(it).sc}

function renderCountries(){
  $('countries').innerHTML=Object.keys(COUNTRIES).map(function(k){var c=COUNTRIES[k];
    return '<button class="chip" data-c="'+k+'"'+(c.on?'':' disabled title="قريبا"')+' aria-pressed="'+(S.country===k)+'">'+c.n+(c.on?'':' (قريبا)')+'</button>'}).join('');
}
function renderNiches(){
  $('niches').innerHTML=S.nichesList.map(function(n){return '<button class="chip" data-n="'+n.id+'" aria-pressed="'+(S.niche===n.id)+'">'+esc(n.ar)+'</button>'}).join('');
}
function renderAssume(){
  $('assumeRow').innerHTML=AF.map(function(a){return '<div class="fld" style="width:120px"><label for="a-'+a[0]+'">'+a[1]+'</label><input type="number" id="a-'+a[0]+'" data-a="'+a[0]+'" value="'+A[a[0]]+'" min="0" step="any"></div>'}).join('');
}
function calcBox(it){
  var p=profit(it.sell,it.cost),v=verdict(p);
  return '<details class="calcbox"><summary>احسب الربح</summary>'+
   '<div class="calc"><div class="fld"><label>ثمن البيع ('+cur()+')</label><input type="number" min="0" step="any" data-f="sell" value="'+(it.sell?Math.round(it.sell):'')+'"></div>'+
   '<div class="fld"><label>ثمن الشراء ('+cur()+')</label><input type="number" min="0" step="any" data-f="cost" value="'+(it.cost?Math.round(it.cost):'')+'"></div></div>'+
   '<div class="verdict"><span class="pill tone-'+v.c+'" data-v>'+(it.sell?v.t:'دخل الأثمنة')+'</span><span class="num" data-net>'+(it.sell?fmt(p.net)+' '+cur()+' ربح/طلب':'')+'</span></div></details>';
}
function adsCard(it,i){
  var img=it.image?'<img src="'+esc(it.image)+'" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">':'<span class="noimg">بلا صورة</span>';
  var tags='';
  if(it.newestDays<=14)tags+='<span class="tag hot">كيتجدد دابا</span>';
  if(it.days>=90)tags+='<span class="tag">خدام من '+it.days+' يوم</span>';
  var l='';
  if(it.snapshot)l+='<a href="'+esc(it.snapshot)+'" target="_blank" rel="noopener noreferrer">شوف الإعلان</a>';
  if(it.link)l+='<a href="'+esc(it.link)+'" target="_blank" rel="noopener noreferrer">صفحة البيع</a>';
  return '<article class="card ads" data-i="'+i+'"><div class="thumb">'+img+'<span class="score num tone-'+tone(it.score)+'">'+it.score+'</span></div>'+
   '<div class="body"><h3>'+esc(it.title||it.text||'منتج')+'</h3>'+
   '<div class="facts num"><div><b>'+it.ads+'</b>إعلانات</div><div><b>'+it.advertisers.length+'</b>معلنين</div><div><b>'+it.days+'</b>يوم</div></div>'+
   (tags?'<div class="tags">'+tags+'</div>':'')+
   (l?'<div class="links">'+l+'</div>':'')+calcBox(it)+'</div></article>';
}
function jmCard(it,i){
  var r=jmScore(it),p=r.p;
  var img=it.image?'<img src="'+esc(it.image)+'" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">':'';
  return '<article class="card jm" data-i="'+i+'"><div class="thumb">'+img+'<span class="rank num">#'+it.rank+'</span><span class="score num tone-'+tone(r.sc)+'" data-sc>'+r.sc+'</span></div>'+
   '<div class="body"><h3><a href="'+esc(it.link)+'" target="_blank" rel="noopener noreferrer">'+esc(it.title)+'</a></h3>'+
   '<div class="meta num"><span><b>'+Math.round(it.priceMAD||it.price*10)+'</b> د.م</span><span>'+(it.rating?'<b>'+it.rating+'</b> / 5':'')+'</span><span>'+(it.reviews?'<b>'+fmt(it.reviews)+'</b> تقييم':'')+'</span></div>'+
   calcBox(it)+'</div></article>';
}
function render(){
  var list=S.items.slice(),s=$('sort').value;
  if(s==='score')list.sort(function(a,b){return totalScore(b)-totalScore(a)});
  else if(s==='new'&&S.source==='ads')list.sort(function(a,b){return a.newestDays-b.newestDays});
  else if(s==='old'&&S.source==='ads')list.sort(function(a,b){return b.days-a.days});
  $('grid').innerHTML=list.map(function(it){var i=S.items.indexOf(it);return it.ads!=null?adsCard(it,i):jmCard(it,i)}).join('');
}
function refreshCard(el){
  var it=S.items[+el.dataset.i],p=profit(it.sell,it.cost),v=verdict(p);
  var vv=el.querySelector('[data-v]');vv.textContent=it.sell?v.t:'دخل الأثمنة';vv.className='pill tone-'+v.c;
  el.querySelector('[data-net]').textContent=it.sell?fmt(p.net)+' '+cur()+' ربح/طلب':'';
  var sc=el.querySelector('[data-sc]');if(sc){var r=jmScore(it);sc.textContent=r.sc;sc.className='score num tone-'+tone(r.sc)}
}
function setLoading(on){document.body.classList.toggle('loading',on)}
function load(){
  var url=S.source==='ads'?'/api/ads-products?niche='+encodeURIComponent(S.niche)+'&limit='+$('limit').value
                          :'/api/products?niche='+encodeURIComponent(S.niche)+'&limit='+$('limit').value;
  $('grid').innerHTML='';
  $('status').innerHTML='<div class="empty">'+(S.source==='ads'?'كنقلبو على الإعلانات المغربية... ممكن تدوم دقيقة.':'كنجيبو المنتجات...')+'</div>';
  setLoading(true);
  fetch(url).then(function(r){return r.json()}).then(function(j){
    setLoading(false);loadUsage();
    if(j.error){$('status').innerHTML='<div class="banner warn">'+esc(j.error)+'</div>';return}
    S.items=j.items.map(function(it){
      if(it.ads!=null)return Object.assign({sell:0,cost:0},it);
      var sell=it.priceMAD||it.price*10;return Object.assign({},it,{sell:sell,cost:sell*0.25});
    });
    var b='';
    if(j.source==='demo')b='<div class="banner warn"><b>نسخة تجريبية:</b> الأرقام والصور نموذج.'+(j.warnings&&j.warnings.length?'<details><summary>علاش؟</summary>'+j.warnings.map(esc).join('<br>')+'</details>':'')+'</div>';
    else if(j.source==='ads')b='<div class="banner ok">إعلانات Facebook المغربية ('+j.total+' إعلان تحلل). السكور = مدة الإعلان وعدد الإعلانات والمعلنين وواش باقي كيتجدد. هادي مؤشرات، ماشي مبيعات حقيقية.'+(j.warnings&&j.warnings.length?'<details><summary>تنبيهات</summary>'+j.warnings.map(esc).join('<br>')+'</details>':'')+'</div>';
    else b='<div class="banner ok">المصدر: Jumia المغرب. ثمن البيع = ثمن Jumia، والشراء 25% منو (بدّلو فكل بطاقة).</div>';
    $('status').innerHTML=b+(S.items.length?'':'<div class="empty">ما لقينا منتجات. جرب نيش آخر.</div>');
    render();
  }).catch(function(){
    setLoading(false);
    $('status').innerHTML='<div class="banner warn">ما قدرناش نتصلو بالسيرفر. عاود المحاولة من بعد شوية.</div>';
  });
}

document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.n){S.niche=b.dataset.n;renderNiches()}
  else if(b.dataset.c&&COUNTRIES[b.dataset.c].on){S.country=b.dataset.c;renderCountries()}
  else if(b.dataset.s){S.source=b.dataset.s;document.querySelectorAll('#sources button').forEach(function(x){x.setAttribute('aria-pressed',x.dataset.s===S.source)})}
  else if(b.id==='go')load();
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset.a){A[t.dataset.a]=parseFloat(t.value)||0;document.querySelectorAll('.card').forEach(refreshCard)}
  else if(t.dataset.f){var c=t.closest('.card');S.items[+c.dataset.i][t.dataset.f]=parseFloat(t.value)||0;refreshCard(c)}
});
$('sort').addEventListener('change',render);
function loadUsage(){fetch('/api/usage').then(function(r){return r.json()}).then(function(u){
  if(u.error||u.used==null){$('usage').textContent='';return}
  $('usage').textContent='رصيد Apify: صرفتي $'+Number(u.used).toFixed(2)+(u.max?' من $'+Number(u.max).toFixed(2):'')+' هاد الشهر';
}).catch(function(){})}
renderCountries();renderAssume();loadUsage();
fetch('/api/niches').then(function(r){return r.json()}).then(function(l){S.nichesList=l;renderNiches();$('status').innerHTML='<div class="empty">اختار النيش والمصدر، ثم ضغط على «اعرض المنتجات».</div>'});
})();
</script>
</body>
</html>
