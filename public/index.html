<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صائد المنتجات الرابحة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#EEF1F0; --surface:#FFFFFF; --ink:#12211D; --muted:#5B6B66; --line:#D5DDDA;
  --accent:#0F5C8C; --accent-ink:#FFFFFF; --soft:#E3EDF3;
  --good:#13795B; --warn:#A8670C; --bad:#B8322F;
  --good-bg:#DDF0E8; --warn-bg:#F7EAD2; --bad-bg:#F6DEDD;
  --f-display:"Cairo","Segoe UI",Tahoma,sans-serif; --f-body:"Tajawal","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E1715; --surface:#15221F; --ink:#E6EFEC; --muted:#93A59F; --line:#2A3B37;
  --accent:#5BB0E3; --accent-ink:#07202F; --soft:#1B2D38;
  --good:#4CC9A0; --warn:#E3B04B; --bad:#F0807C;
  --good-bg:#17332B; --warn-bg:#352B15; --bad-bg:#3A1F1E; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;padding:0 16px 40px}
.wrap{max-width:1180px;margin-inline:auto}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.25}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{padding-block:22px 14px}
header h1{font-size:1.6rem;font-weight:800}
header p{margin:2px 0 0;color:var(--muted);font-size:.92rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:.85rem;color:var(--muted)}
select,input[type=number]{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
input[type=number]{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:7px 15px;font-size:.92rem}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:10px 22px;font-weight:700}
.btn.ghost{background:transparent;color:var(--accent)}
.note{font-size:.82rem;color:var(--muted);margin:8px 0 0}
.banner{border-radius:12px;padding:12px 14px;font-size:.92rem;margin-bottom:14px}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.ok{background:var(--good-bg);color:var(--good)}
.banner details{margin-top:6px;font-size:.82rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.thumb{position:relative;aspect-ratio:1/1;background:#fff;display:grid;place-items:center}
.thumb img{max-width:100%;max-height:100%;object-fit:contain}
.rank{position:absolute;top:8px;inset-inline-start:8px;background:var(--ink);color:var(--bg);font-family:var(--f-display);font-weight:800;font-size:.85rem;border-radius:8px;padding:1px 9px}
.score{position:absolute;top:8px;inset-inline-end:8px;font-family:var(--f-display);font-weight:800;border-radius:10px;padding:2px 10px;font-size:1.05rem}
.tone-good{background:var(--good-bg);color:var(--good)}
.tone-warn{background:var(--warn-bg);color:var(--warn)}
.tone-bad{background:var(--bad-bg);color:var(--bad)}
.body{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}
.body h3{font-size:.95rem;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.body h3 a{color:inherit;text-decoration:none}
.body h3 a:hover{color:var(--accent)}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.82rem;color:var(--muted)}
.meta b{color:var(--ink)}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:.78rem;color:var(--muted)}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;background:var(--accent)}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto}
.calc .fld label{font-size:.75rem}
.calc input{padding:6px 8px;font-size:.9rem}
.verdict{display:flex;justify-content:space-between;align-items:center;font-size:.82rem;border-top:1px solid var(--line);padding-top:8px}
.pill{padding:2px 10px;border-radius:99px;font-weight:700;font-size:.8rem}
.empty{text-align:center;color:var(--muted);padding:50px 12px}
.spin{display:inline-block;width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite;vertical-align:middle;margin-inline-end:8px}
@keyframes s{to{transform:rotate(360deg)}}
.num{font-variant-numeric:tabular-nums}
@media (max-width:560px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .thumb{aspect-ratio:4/3}
  .thumb img{padding:6px}
  .rank{top:6px;inset-inline-start:6px;font-size:.75rem;padding:0 7px}
  .score{top:6px;inset-inline-end:6px;font-size:.9rem;padding:1px 8px}
  .body{padding:10px;gap:6px}
  .body h3{font-size:.84rem;min-height:2.5em}
  .meta{font-size:.74rem;gap:2px 8px}
  .bars{grid-template-columns:1fr;gap:4px;font-size:.72rem}
  .calc{grid-template-columns:1fr;gap:6px}
  .calc .fld label{font-size:.72rem}
  .verdict{flex-wrap:wrap;gap:4px;font-size:.76rem}
}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>صائد المنتجات الرابحة</h1>
  <p>اختار النيش وعدد المنتجات، وكيطلعو ليك الأكثر مبيعا مرتبين بالصور والنقطة.</p>
</header>

<div class="panel">
  <div class="fld" style="margin-bottom:12px"><label>النيش</label><div class="chips" id="niches"></div></div>
  <div class="row">
    <div class="fld"><label for="limit">عدد المنتجات</label>
      <select id="limit"><option>10</option><option>20</option><option>30</option><option>50</option></select></div>
    <div class="fld"><label for="country">بلد البيع</label><select id="country"></select></div>
    <div class="fld"><label for="sort">الترتيب</label>
      <select id="sort"><option value="score">حسب النقطة الإجمالية</option><option value="rank">حسب ترتيب المبيعات</option></select></div>
    <button class="btn" id="go">اعرض المنتجات</button>
  </div>
</div>

<details class="panel" id="assume">
  <summary style="cursor:pointer;font-weight:700">افتراضات حساب الربح (COD)</summary>
  <div class="row" style="margin-top:12px" id="assumeRow"></div>
  <p class="note">هاد الأرقام كتستعمل فحساب النقطة ديال كل منتج. بدّلها بأرقامك الحقيقية وكتتحدث النقط فالحين.</p>
</details>

<div id="status"></div>
<div class="grid" id="grid"></div>
</div>

<script>
(function(){
var COUNTRIES={MA:{n:'المغرب',cur:'د.م',fx:10},SA:{n:'السعودية',cur:'ر.س',fx:3.75},AE:{n:'الإمارات',cur:'د.إ',fx:3.67},DZ:{n:'الجزائر',cur:'د.ج',fx:135},TN:{n:'تونس',cur:'د.ت',fx:3.1},EG:{n:'مصر',cur:'ج.م',fx:48}};
var A={ship:35,other:10,ret:20,cpl:25,conf:60,del:70,fx:10};
var AF=[['ship','التوصيل'],['other','مصاريف أخرى'],['ret','ثمن الرجوع'],['cpl','تكلفة الإعلان (CPL)'],['conf','التأكيد %'],['del','التسليم %'],['fx','سعر الدولار']];
var S={niche:'home',items:[],source:'',nichesList:[]};
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function fmt(n){return isFinite(n)?Math.round(n).toLocaleString('en-US'):'-'}
function cur(){return COUNTRIES[$('country').value].cur}

/* نقطة السوق (50) من ترتيب المبيعات وعدد التقييمات والتقييم */
function market(it,n){
  var rk=1-(it.rank-1)/Math.max(n,10);
  var rv=clamp(Math.log10(Math.max(it.reviews,1))/5,0,1);
  var ra=it.rating?clamp((it.rating-3.5)/1.5,0,1):0.5;
  return clamp(rk,0,1)*20+rv*20+ra*10;
}
/* نقطة الربح (50) بافتراضات COD */
function profit(sell,cost){
  var c=A.conf/100,d=A.del/100,D=c*d;
  if(sell<=0||D<=0)return {pts:0,net:0,margin:0};
  var be=D*(sell-cost-A.ship-A.other)-(c-D)*A.ret;
  var pl=be-A.cpl;
  var net=pl/D,margin=net/sell;
  return {pts:pl>0?clamp(margin/0.30,0,1)*50:0,net:net,margin:margin,loss:pl<=0};
}
function verdict(sc,loss){
  if(loss)return {t:'خاسر',c:'bad'};
  if(sc>=75)return {t:'رابح',c:'good'};
  if(sc>=60)return {t:'واعد',c:'good'};
  if(sc>=45)return {t:'مخاطرة',c:'warn'};
  return {t:'ضعيف',c:'bad'};
}
function score(it){
  var m=market(it,S.items.length),p=profit(it.sell,it.cost);
  var sc=Math.round(m+p.pts);
  if(p.loss)sc=Math.min(sc,39);
  return {sc:sc,m:m,p:p,v:verdict(sc,p.loss)};
}

function renderNiches(){
  $('niches').innerHTML=S.nichesList.map(function(n){return '<button class="chip" data-n="'+n.id+'" aria-pressed="'+(S.niche===n.id)+'">'+esc(n.ar)+'</button>'}).join('');
}
function renderAssume(){
  $('assumeRow').innerHTML=AF.map(function(a){return '<div class="fld" style="width:120px"><label for="a-'+a[0]+'">'+a[1]+'</label><input type="number" id="a-'+a[0]+'" data-a="'+a[0]+'" value="'+A[a[0]]+'" min="0" step="any"></div>'}).join('');
}
function card(it,i){
  var r=score(it);
  var img=it.image?'<img src="'+esc(it.image)+'" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display=\'none\'">':'';
  return '<article class="card" data-i="'+i+'">'+
   '<div class="thumb">'+img+'<span class="rank num">#'+it.rank+'</span><span class="score num tone-'+r.v.c+'" data-sc>'+r.sc+'</span></div>'+
   '<div class="body"><h3><a href="'+esc(it.link)+'" target="_blank" rel="noopener noreferrer">'+esc(it.title)+'</a></h3>'+
   '<div class="meta num"><span>'+(it.priceMAD?'<b>'+Math.round(it.priceMAD)+'</b> د.م':'$<b>'+(it.price?it.price.toFixed(2):'-')+'</b>')+'</span><span>'+(it.rating?'<b>'+it.rating+'</b> / 5':'')+'</span><span>'+(it.reviews?'<b>'+fmt(it.reviews)+'</b> تقييم':'')+'</span></div>'+
   '<div class="bars"><div>السوق <span class="num" data-m>'+Math.round(r.m)+'</span>/50<div class="bar"><i data-mb style="width:'+(r.m*2)+'%"></i></div></div><div>الربح <span class="num" data-p>'+Math.round(r.p.pts)+'</span>/50<div class="bar"><i data-pb style="width:'+(r.p.pts*2)+'%"></i></div></div></div>'+
   '<div class="calc"><div class="fld"><label>ثمن البيع ('+cur()+')</label><input type="number" min="0" step="any" data-f="sell" value="'+Math.round(it.sell)+'"></div><div class="fld"><label>ثمن الشراء ('+cur()+')</label><input type="number" min="0" step="any" data-f="cost" value="'+Math.round(it.cost)+'"></div></div>'+
   '<div class="verdict"><span class="pill tone-'+r.v.c+'" data-v>'+r.v.t+'</span><span class="num" data-net>'+fmt(r.p.net)+' '+cur()+' ربح/طلب</span></div></div></article>';
}
function render(){
  var list=S.items.slice();
  if($('sort').value==='score')list.sort(function(a,b){return score(b).sc-score(a).sc});
  else list.sort(function(a,b){return a.rank-b.rank});
  $('grid').innerHTML=list.map(function(it){return card(it,S.items.indexOf(it))}).join('');
}
function refreshCard(el){
  var it=S.items[+el.dataset.i],r=score(it);
  el.querySelector('[data-sc]').textContent=r.sc;
  el.querySelector('[data-sc]').className='score num tone-'+r.v.c;
  el.querySelector('[data-m]').textContent=Math.round(r.m);
  el.querySelector('[data-p]').textContent=Math.round(r.p.pts);
  el.querySelector('[data-pb]').style.width=(r.p.pts*2)+'%';
  el.querySelector('[data-v]').textContent=r.v.t;
  el.querySelector('[data-v]').className='pill tone-'+r.v.c;
  el.querySelector('[data-net]').textContent=fmt(r.p.net)+' '+cur()+' ربح/طلب';
}
function load(){
  var limit=$('limit').value;
  $('grid').innerHTML='';
  $('status').innerHTML='<div class="empty"><span class="spin"></span>كنجيبو المنتجات...</div>';
  fetch('/api/products?niche='+encodeURIComponent(S.niche)+'&limit='+limit).then(function(r){return r.json()}).then(function(j){
    if(j.error){$('status').innerHTML='<div class="banner warn">'+esc(j.error)+'</div>';return}
    var fx=A.fx;
    S.items=j.items.map(function(it){var sell=it.price*fx;return Object.assign({},it,{sell:sell,cost:sell*0.25})});
    S.source=j.source;
    var b='';
    if(j.source==='demo'){
      b='<div class="banner warn"><b>نسخة تجريبية:</b> المنتجات والأرقام والصور مجرد نموذج باش تشوف الواجهة. باش تجيب منتجات حقيقية، حط مفتاح Rainforest فملف .env (شوف README).'+
        (j.warnings&&j.warnings.length?'<details><summary>علاش ما خدماش المصدر الحقيقي؟</summary>'+j.warnings.map(esc).join('<br>')+'</details>':'')+'</div>';
    }else{
      b='<div class="banner ok">المصدر: '+(j.source==='jumia'?'Jumia المغرب (jumia.ma)':j.source==='rainforest'?'Amazon Best Sellers عبر Rainforest API':'Amazon Best Sellers')+'. ثمن البيع افتراضيا = ثمن '+(j.source==='jumia'?'Jumia بالدرهم':'Amazon بالدولار × سعر الصرف')، والشراء 25% منو. عدّلهم فكل بطاقة.</div>';
    }
    $('status').innerHTML=b;
    render();
  }).catch(function(){
    $('status').innerHTML='<div class="banner warn">ما قدرناش نتصلو بالسيرفر. تأكد أن البرنامج خدام (start).</div>';
  });
}

document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.n){S.niche=b.dataset.n;renderNiches();load()}
  if(b.id==='go')load();
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset.a){A[t.dataset.a]=parseFloat(t.value)||0;document.querySelectorAll('.card').forEach(refreshCard)}
  else if(t.dataset.f){
    var card=t.closest('.card'),it=S.items[+card.dataset.i];
    it[t.dataset.f]=parseFloat(t.value)||0;refreshCard(card);
  }
});
$('sort').addEventListener('change',render);
$('limit').addEventListener('change',load);
$('country').addEventListener('change',function(){A.fx=COUNTRIES[$('country').value].fx;renderAssume();load()});

$('country').innerHTML=Object.keys(COUNTRIES).map(function(k){return '<option value="'+k+'">'+COUNTRIES[k].n+'</option>'}).join('');
renderAssume();
fetch('/api/niches').then(function(r){return r.json()}).then(function(l){S.nichesList=l;S.niche=l[1]?l[1].id:l[0].id;renderNiches();load()});
})();
</script>
</body>
</html>
