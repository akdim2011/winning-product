name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache-dependency-path: '' # تعطيل البحث الإلزامي عن ملف القفل

      - name: Generate Package-Lock if missing & Install Dependencies
        run: |
          if [ ! -f "package-lock.json" ]; then
            npm install --package-lock-only || true
          fi
          npm install
          npm install --save @capacitor/core @capacitor/cli @capacitor/android

      - name: Verify Public Directory and index.html
        run: |
          mkdir -p public
          if [ ! -f "public/index.html" ] && [ -f "index.html" ]; then
            mv index.html public/
          fi

      - name: Create Capacitor Config
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.winningproduct.app",
            "appName": "Winning Product",
            "webDir": "public"
          }
          EOF

      - name: Add Android Platform and Copy
        run: |
          npx cap add android || true
          npx cap copy android

      - name: Build APK using Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
