name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Public Directory
        run: |
          mkdir -p public
          if [ -f "index.html" ]; then
            cp index.html public/index.html
          elif [ ! -f "public/index.html" ]; then
            echo "<!DOCTYPE html><html><body><h1>Loading...</h1></body></html>" > public/index.html
          fi

      - name: Create Capacitor Config
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.winningproduct.app",
            "appName": "Winning Product",
            "webDir": "public",
            "server": {
              "url": "https://winning-product.onrender.com"
            }
          }
          EOF

      - name: Install Capacitor 7
        run: |
          [ -f package.json ] || npm init -y
          npm install --save-dev @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Add and Sync Android
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Build APK using Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
