name: Build Android APK

on:
  push:
    branches: [ "app-free" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test
        run: npm install && npm test

      - name: Add Android and icons
        run: |
          rm -rf android
          npx cap add android
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            dir=android/app/src/main/res/mipmap-${d%%:*}; px=${d##*:}
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              rsvg-convert -w $px -h $px public/icon.svg -o $dir/$n.png
            done
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: radar-cod-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a Release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk radar-cod.apk
          gh release delete app-free-latest --yes --cleanup-tag || true
          gh release create app-free-latest radar-cod.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Radar COD (APK)" \
            --notes "Debug APK. Download radar-cod.apk on your phone and install it."
